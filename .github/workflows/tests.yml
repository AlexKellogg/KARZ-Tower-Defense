name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: karz
          POSTGRES_PASSWORD: karz
          POSTGRES_DB: karz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U karz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      KARZ_TEST_POSTGRES_URL: postgresql://karz:karz@localhost:5432/karz_test
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install game and server packages
        run: python -m pip install -r server/requirements.txt

      - name: Run all tests (including PostgreSQL)
        run: python -m unittest discover -s . -p "test_*.py" -v

      - name: Smoke test every screen
        run: python main.py --smoke
